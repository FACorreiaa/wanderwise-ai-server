      retries: 3

  # Interests Service
  interests-service:
    container_name: interests-service
    build:
      context: ./internal/domain/interests
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      - SERVICE_NAME=interests-service
      - SERVICE_PORT=8008
      - GRPC_PORT=9008
    ports:
      - "8008:8008"   # HTTP API
      - "9008:9008"   # gRPC
      - "2352:2345"   # Delve debug
      - "6067:6060"   # pprof
    volumes:
      - ./internal/domain/interests:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - microservices-net
