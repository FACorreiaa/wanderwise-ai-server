  # City Service
  city-service:
    container_name: city-service
    build:
      context: ./internal/domain/city
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      - SERVICE_NAME=city-service
      - SERVICE_PORT=8007
