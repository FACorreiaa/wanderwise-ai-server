      - "6070:6060"   # pprof
    volumes:
      - ./internal/domain/reviews:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      poi-service:
        condition: service_healthy
    networks:
