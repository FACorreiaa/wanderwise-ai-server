version: '3.8'

services:
  # === Core Microservices ===
  
  # Auth Service
  auth-service:
    container_name: auth-service
    build:
      context: ./internal/domain/auth
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      - SERVICE_NAME=auth-service
      - SERVICE_PORT=8001
      - GRPC_PORT=9001
    ports:
      - "8001:8001"   # HTTP API
      - "9001:9001"   # gRPC
      - "2345:2345"   # Delve debug
      - "6060:6060"   # pprof
    volumes:
      - ./internal/domain/auth:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # POI Service
  poi-service:
