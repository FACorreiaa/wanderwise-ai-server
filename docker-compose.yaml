      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Profiles Service
  profiles-service:
    container_name: profiles-service
    build:
      context: ./internal/domain/profiles
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      - SERVICE_NAME=profiles-service
      - SERVICE_PORT=8009
      - GRPC_PORT=9009
    ports:
      - "8009:8009"   # HTTP API
      - "9009:9009"   # gRPC
      - "2353:2345"   # Delve debug
      - "6068:6060"   # pprof
    volumes:
      - ./internal/domain/profiles:/app
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      users-service:
        condition: service_healthy
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Recents Service
  recents-service:
    container_name: recents-service
    build:
      context: ./internal/domain/recents
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
