mode: ${APP_ENV}
dotenv: ".env/dev"

HandlerImpls:
  externalAPI:
    port: "8081"
    certFile: "./.data/server.crt"
    keyFile: "./.data/server.key"
    enableTLS: false
  internalAPI:
    port: "8083"
    certFile: "./.data/server.crt"
    keyFile: "./.data/server.key"
    enableTLS: false
  pprof:
    port: "8082"
    certFile: "./.data/server.crt"
    keyFile: "./.data/server.key"
    enableTLS: false
  prometheus:
    port: "8084"
    certFile: "./.data/server.crt"
    keyFile: "./.data/server.key"
    enableTLS: false

services:
  auth:
    authTokenTTL: 5
    refreshTokenTTL: 20160
    pubKeyFile: "./.data/id_rsa.pub"
    pemKeyFile: "./.data/id_rsa"

repositories:
  postgres:
    # port: "5432"
    # host: "postgres-loci"
    password: "postgres"
    port: "5454"
    host: "localhost"
    username: "postgres"
    db: "loci-dev"
    SSLMODE: "verify-full"
    MAXCONWAITINGTIME: 10
  redis:
    host: "localhost"
    port: "6379"
    password: ""
    db: 0
jwt:
  secret: ${JWT_SECRET_KEY}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  accessTokenTTL: 15m # Default value if ENV not set or invalid
  refreshTokenTTL: 168h # Default value if ENV not set or invalid

# Rate limiting configuration for LLM calls
rateLimit:
  enabled: true # Set to false for development
  anonymous:
    perMinute: 2   # Very limited for anonymous users
    perHour: 10
    perDay: 20
  loggedIn:
    perMinute: 5   # Reasonable limits for registered users
    perHour: 50
    perDay: 200
  paying:
    perMinute: 20  # Higher limits for paying users
    perHour: 500
    perDay: 2000
  # redis:
  #   host: "redis"
  #   port: "6388"
  #   db: 0
  #   ttl: 120s

#change later
server:
  HTTPPort: "8000"
  GrpcPort: "9000"
  HTTPTimeout: 15s
upstreamServices:
  auth: "http://auth-service:8001"
  poi: "http://poi-service:8002"
  chat: "http://chat-service:8003"
  lists: "http://lists-service:8004"
  users: "http://users-service:8005"
  admin: "http://admin-service:8006"
  city: "http://city-service:8007"
  interests: "http://interests-service:8008"
  profiles: "http://profiles-service:8009"
  recents: "http://recents-service:8010"
  reviews: "http://reviews-service:8011"
  statistics: "http://statistics-service:8012"
  tags: "http://tags-service:8013"

otel:
  serviceName: ${OTEL_SERVICE_NAME}
  exporterOTLPEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}

# Logging settings (optional)
logging:
  level: ${LOG_LEVEL}
