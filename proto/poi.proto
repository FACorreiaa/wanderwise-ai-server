syntax = "proto3";

package loci.poi;

option go_package = "github.com/your-org/go-ai-poi-server/gen/proto/poi";

import "google/protobuf/timestamp.proto";
import "proto/common.proto";

// POIDetailedInfo represents a point of interest
message POIDetailedInfo {
  string id = 1;
  string city = 2;
  string city_id = 3;
  string name = 4;
  optional string description_poi = 5;
  double distance = 6;
  optional double latitude = 7;
  optional double longitude = 8;
  string category = 9;
  string description = 10;
  double rating = 11;
  string address = 12;
  string phone_number = 13;
  string website = 14;
  map<string, string> opening_hours = 15;
  repeated string images = 16;
  string price_range = 17;
  string price_level = 18;
  repeated string reviews = 19;
  string llm_interaction_id = 20;
  repeated string tags = 21;
  optional int32 priority = 22;
  google.protobuf.Timestamp created_at = 23;
  optional string cuisine_type = 24; // For restaurants
  optional string star_rating = 25;  // For hotels
  string amenities = 26;
  optional string source = 27;
}

// HotelDetailedInfo represents hotel-specific information
message HotelDetailedInfo {
  string id = 1;
  string city = 2;
  string name = 3;
  double latitude = 4;
  double longitude = 5;
  string category = 6;
  string description = 7;
  string address = 8;
  optional string phone_number = 9;
  optional string website = 10;
  optional string opening_hours = 11;
  optional string price_range = 12;
  double rating = 13;
  repeated string tags = 14;
  repeated string images = 15;
  string llm_interaction_id = 16;
}

// RestaurantDetailedInfo represents restaurant-specific information
message RestaurantDetailedInfo {
  string id = 1;
  string city = 2;
  string name = 3;
  double latitude = 4;
  double longitude = 5;
  string category = 6;
  string description = 7;
  optional string address = 8;
  optional string website = 9;
  optional string phone_number = 10;
  optional string opening_hours = 11;
  optional string price_level = 12;
  optional string cuisine_type = 13;
  repeated string tags = 14;
  repeated string images = 15;
  double rating = 16;
  string llm_interaction_id = 17;
}

// POIFilters for filtering POIs
message POIFilters {
  optional string city = 1;
  optional string category = 2;
  optional string price_range = 3;
}

// SearchPOIRequest for searching POIs
message SearchPOIRequest {
  string query = 1;
  string city_name = 2;
  double latitude = 3;
  double longitude = 4;
  optional double radius_km = 5;
  optional string search_text = 6;
  repeated string search_tags = 7;
  optional string search_type = 8;
  optional string sort_by = 9;
  optional string sort_order = 10;
  optional double min_rating = 11;
  optional string min_price = 12;
  optional int32 min_guests = 13;
}

// SearchPOIResponse for POI search results
message SearchPOIResponse {
  repeated POIDetailedInfo pois = 1;
  loci.common.PaginationMetadata pagination = 2;
}

// GetPOIRequest for retrieving POI details
message GetPOIRequest {
  string poi_id = 1;
}

// GetPOIResponse for POI details retrieval
message GetPOIResponse {
  POIDetailedInfo poi = 1;
}

// AddPoiRequest for adding a POI to a list
message AddPoiRequest {
  string poi_id = 1;
  bool is_llm_poi = 2;
  optional POIDetailedInfo poi_data = 3;
}

// POIService defines POI-related RPCs
service POIService {
  rpc SearchPOI(SearchPOIRequest) returns (SearchPOIResponse);
  rpc GetPOI(GetPOIRequest) returns (GetPOIResponse);
}
