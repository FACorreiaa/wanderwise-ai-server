syntax = "proto3";

package loci.user;

option go_package = "github.com/your-org/go-ai-poi-server/gen/proto/user";

import "google/protobuf/timestamp.proto";
import "proto/common.proto";

// UserStats contains user statistics
message UserStats {
  int32 places_visited = 1;
  int32 reviews_written = 2;
  int32 lists_created = 3;
  int32 followers = 4;
  int32 following = 5;
}

// UserProfile represents a user's profile
message UserProfile {
  string id = 1;
  string email = 2;
  optional string username = 3;
  optional string firstname = 4;
  optional string lastname = 5;
  optional string phone_number = 6;
  optional int32 age = 7;
  optional string city = 8;
  optional string country = 9;
  optional string about_you = 10;
  optional string bio = 11;
  optional string location = 12;
  google.protobuf.Timestamp joined_date = 13;
  optional string avatar = 14;
  repeated string interests = 15;
  repeated string badges = 16;
  optional UserStats stats = 17;
  optional string display_name = 18;
  optional string profile_image_url = 19;
  bool is_active = 20;
  optional google.protobuf.Timestamp email_verified_at = 21;
  optional google.protobuf.Timestamp last_login_at = 22;
  optional string theme = 23;
  optional string language = 24;
  google.protobuf.Timestamp created_at = 25;
  google.protobuf.Timestamp updated_at = 26;
}

// UpdateProfileParams for updating user profile
message UpdateProfileParams {
  optional string username = 1;
  optional string phone_number = 2;
  optional string email = 3;
  optional string display_name = 4;
  optional string profile_image_url = 5;
  optional string firstname = 6;
  optional string lastname = 7;
  optional int32 age = 8;
  optional string city = 9;
  optional string country = 10;
  optional string about_you = 11;
  optional string location = 12;
  repeated string interests = 13;
  repeated string badges = 14;
}

// GetUserProfileRequest for retrieving user profile
message GetUserProfileRequest {
  optional string user_id = 1; // If empty, get authenticated user's profile
}

// GetUserProfileResponse for user profile retrieval
message GetUserProfileResponse {
  UserProfile profile = 1;
}

// UpdateUserProfileRequest for updating user profile
message UpdateUserProfileRequest {
  UpdateProfileParams params = 1;
}

// UserService defines user-related RPCs
service UserService {
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (loci.common.Response);
}
