syntax = "proto3";

package loci.city;

option go_package = "github.com/your-org/go-ai-poi-server/gen/proto/city";

import "google/protobuf/timestamp.proto";
import "proto/common.proto";

// CityDetail represents a city
message CityDetail {
  string id = 1;
  string name = 2;
  string country = 3;
  optional string state_province = 4;
  string ai_summary = 5;
  optional double center_latitude = 6;
  optional double center_longitude = 7;
}

// GeneralCityData contains general information about a city
message GeneralCityData {
  string city = 1;
  string country = 2;
  optional string state_province = 3;
  string description = 4;
  optional double center_latitude = 5;
  optional double center_longitude = 6;
  string population = 7;
  string area = 8;
  string timezone = 9;
  string language = 10;
  string weather = 11;
  string attractions = 12;
  string history = 13;
}

// GetCityRequest for retrieving city details
message GetCityRequest {
  oneof identifier {
    string city_id = 1;
    string city_name = 2;
  }
}

// GetCityResponse for city details retrieval
message GetCityResponse {
  CityDetail city = 1;
}

// SearchCitiesRequest for searching cities
message SearchCitiesRequest {
  string query = 1;
  optional int32 limit = 2;
}

// SearchCitiesResponse for city search results
message SearchCitiesResponse {
  repeated CityDetail cities = 1;
}

// CityService defines city-related RPCs
service CityService {
  rpc GetCity(GetCityRequest) returns (GetCityResponse);
  rpc SearchCities(SearchCitiesRequest) returns (SearchCitiesResponse);
}
