# Default values for go-ai-poi
replicaCount: 2

image:
  repository: go-ai-poi
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false  # Changed to false as the app may need to write temp files
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 9000
  pprofPort: 6060

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: go-ai-poi.local
      paths:
        - path: /
          pathType: Prefix
  tls: 
    - secretName: go-ai-poi-tls
      hosts:
        - go-ai-poi.local

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application specific configuration
config:
  httpPort: 8080
  grpcPort: 9000
  logLevel: "info"
  database:
    host: "postgresql"
    port: 5432
    name: "loci"
    username: "loci"
    sslMode: "disable"
  jwt:
    expiration: "24h"
  openai:
    model: "gpt-4"
  redis:
    host: "redis"
    port: 6379
    db: 0

# Secrets (override in production)
secrets:
  database:
    password: "loci123"
  jwt:
    secret: "your-jwt-secret-key-here"
  openai:
    apiKey: "your-openai-api-key-here"

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "loci123"
    username: "loci"
    password: "loci123"
    database: "loci"
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: 2000m
    extendedConfiguration: |
      # Enable PostGIS and pgvector extensions
      shared_preload_libraries = 'postgis-3,vector'
      max_connections = 200
      shared_buffers = 256MB
      effective_cache_size = 1GB
      maintenance_work_mem = 64MB
      checkpoint_completion_target = 0.9
      wal_buffers = 16MB
      default_statistics_target = 100
      random_page_cost = 1.1
      effective_io_concurrency = 200

# Redis configuration
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 200m

# Observability stack
prometheus:
  enabled: true
  server:
    persistentVolume:
      size: 5Gi
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m

loki:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 200m

tempo:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 200m

grafana:
  enabled: true
  adminPassword: "admin123"
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 200m
  ingress:
    enabled: true
    className: "nginx"
    hosts:
      - grafana.go-ai-poi.local