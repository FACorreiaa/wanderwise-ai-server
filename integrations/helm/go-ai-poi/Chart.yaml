apiVersion: v2
name: go-ai-poi
description: A Helm chart for Go AI POI monorepo application with gRPC and full observability stack
type: application
version: 0.2.0
appVersion: "1.0.0"
home: https://github.com/FACorreiaa/go-ai-poi-server
sources:
  - https://github.com/FACorreiaa/go-ai-poi-server
maintainers:
  - name: FACorreiaa
    email: facorreiaa@gmail.com
keywords:
  - go
  - ai
  - poi
  - travel
  - recommendations
  - grpc
  - monorepo
dependencies:
  - name: postgresql
    version: "15.5.20"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "19.6.4"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: prometheus
    version: "25.27.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
  - name: loki
    version: "6.6.4"
    repository: "https://grafana.github.io/helm-charts"
    condition: loki.enabled
  - name: tempo
    version: "1.10.1"
    repository: "https://grafana.github.io/helm-charts"
    condition: tempo.enabled
  - name: grafana
    version: "8.4.2"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled