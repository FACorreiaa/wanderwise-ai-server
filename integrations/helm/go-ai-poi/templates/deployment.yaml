apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-ai-poi.fullname" . }}
  labels:
    {{- include "go-ai-poi.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "go-ai-poi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "go-ai-poi.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "go-ai-poi.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.config.grpcPort }}
              protocol: TCP
            - name: pprof
              containerPort: 6060
              protocol: TCP
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: HTTP_PORT
              value: "{{ .Values.config.httpPort }}"
            - name: GRPC_PORT
              value: "{{ .Values.config.grpcPort }}"
            - name: LOG_LEVEL
              value: "{{ .Values.config.logLevel }}"
            - name: POSTGRES_HOST
              value: "{{ .Values.config.database.host }}"
            - name: POSTGRES_PORT
              value: "{{ .Values.config.database.port }}"
            - name: POSTGRES_DB
              value: "{{ .Values.config.database.name }}"
            - name: POSTGRES_USER
              value: "{{ .Values.config.database.username }}"
            - name: POSTGRES_SSLMODE
              value: "{{ .Values.config.database.sslMode }}"
            - name: REDIS_HOST
              value: "{{ .Values.config.redis.host }}"
            - name: REDIS_PORT
              value: "{{ .Values.config.redis.port }}"
            - name: REDIS_DB
              value: "{{ .Values.config.redis.db }}"
            - name: JWT_EXPIRATION
              value: "{{ .Values.config.jwt.expiration }}"
            - name: OPENAI_MODEL
              value: "{{ .Values.config.openai.model }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-ai-poi.fullname" . }}-secrets
                  key: database-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-ai-poi.fullname" . }}-secrets
                  key: jwt-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "go-ai-poi.fullname" . }}-secrets
                  key: openai-api-key
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}