apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: go-ai-poi-project
  namespace: argocd
  labels:
    app.kubernetes.io/name: go-ai-poi-project
    app.kubernetes.io/part-of: go-ai-poi-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Project for Go AI POI monorepo application and its observability stack
  
  # Source repositories
  sourceRepos:
    - 'https://github.com/FACorreiaa/go-ai-poi-server.git'
    - 'https://charts.bitnami.com/bitnami'
    - 'https://prometheus-community.github.io/helm-charts'
    - 'https://grafana.github.io/helm-charts'
  
  # Destination clusters and namespaces
  destinations:
    - namespace: 'go-ai-poi'
      server: https://kubernetes.default.svc
    - namespace: 'observability'
      server: https://kubernetes.default.svc
    - namespace: 'argocd'
      server: https://kubernetes.default.svc
  
  # Cluster resource allow list
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
    - group: 'networking.k8s.io'
      kind: IngressClass
    - group: 'apiextensions.k8s.io'
      kind: CustomResourceDefinition
  
  # Namespace resource allow list
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: PersistentVolumeClaim
    - group: 'apps'
      kind: Deployment
    - group: 'apps'
      kind: StatefulSet
    - group: 'apps'
      kind: DaemonSet
    - group: 'networking.k8s.io'
      kind: Ingress
    - group: 'autoscaling'
      kind: HorizontalPodAutoscaler
    - group: 'policy'
      kind: PodDisruptionBudget
    - group: 'rbac.authorization.k8s.io'
      kind: Role
    - group: 'rbac.authorization.k8s.io'
      kind: RoleBinding
  
  roles:
    # Admin role - full access
    - name: admin
      description: Admin access to go-ai-poi project
      policies:
        - p, proj:go-ai-poi-project:admin, applications, *, go-ai-poi-project/*, allow
        - p, proj:go-ai-poi-project:admin, logs, get, go-ai-poi-project/*, allow
        - p, proj:go-ai-poi-project:admin, exec, create, go-ai-poi-project/*, allow
      groups:
        - go-ai-poi:admin
    
    # Developer role - limited access
    - name: developer
      description: Developer access to go-ai-poi project
      policies:
        - p, proj:go-ai-poi-project:developer, applications, get, go-ai-poi-project/*, allow
        - p, proj:go-ai-poi-project:developer, applications, sync, go-ai-poi-project/*, allow
        - p, proj:go-ai-poi-project:developer, logs, get, go-ai-poi-project/*, allow
      groups:
        - go-ai-poi:developer
    
    # Read-only role
    - name: readonly
      description: Read-only access to go-ai-poi project
      policies:
        - p, proj:go-ai-poi-project:readonly, applications, get, go-ai-poi-project/*, allow
        - p, proj:go-ai-poi-project:readonly, logs, get, go-ai-poi-project/*, allow
      groups:
        - go-ai-poi:readonly