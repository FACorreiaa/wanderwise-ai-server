apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-ai-poi-app
  namespace: argocd
  labels:
    app.kubernetes.io/name: go-ai-poi
    app.kubernetes.io/part-of: go-ai-poi-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/FACorreiaa/go-ai-poi-server.git
    targetRevision: HEAD
    path: integrations/helm/go-ai-poi
    helm:
      releaseName: go-ai-poi
      valueFiles:
        - values.yaml
      values: |
        image:
          tag: "latest"
        ingress:
          hosts:
            - host: go-ai-poi.local
              paths:
                - path: /
                  pathType: Prefix
        postgresql:
          enabled: true
        redis:
          enabled: true
        prometheus:
          enabled: true
        loki:
          enabled: true
        tempo:
          enabled: true
        grafana:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: go-ai-poi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3